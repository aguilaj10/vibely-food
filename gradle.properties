# AGP 9.x + kotlin.multiplatform compatibility
# The 'com.android.library'/'com.android.application' plugins are not compatible
# with 'kotlin.multiplatform' since AGP 9.0. These properties temporarily bypass
# the restriction while the 'com.android.kotlin.multiplatform.library' migration
# is planned for the next feature iteration.
android.builtInKotlin=false
android.newDsl=false

# Kotlin/JS: suppress "no executable" warning for library modules
kotlin.js.generate.executable.default=false
