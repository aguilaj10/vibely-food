# Detekt configuration for Vibely POS
# Aligned with .kittify/memory/constitution.md — Code Quality section
# See: https://detekt.dev/docs/introduction/configurations

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  UndocumentedPublicFunction:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]
  UndocumentedPublicProperty:
    active: true
    excludes: ["**/test/**", "**/androidTest/**"]

complexity:
  active: true
  CyclomaticComplexity:
    active: true
    threshold: 15
  NestedBlockDepth:
    active: true
    threshold: 4
  LongMethod:
    active: true
    threshold: 60
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 10
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: true

naming:
  active: true

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    values: ["FIXME:", "HACK:", "TODO:"]
    allowedPatterns: ""
  ForbiddenImport:
    active: true
    forbiddenPatterns:
      - reason: "Prevent Android/framework imports in domain layer"
        value: "android.*"
        applies_to_subpath: "core/domain"
      - reason: "Prevent Ktor imports in domain layer"
        value: "io.ktor.*"
        applies_to_subpath: "core/domain"
      - reason: "Prevent Room imports in domain layer"
        value: "androidx.room.*"
        applies_to_subpath: "core/domain"
  MagicNumber:
    active: true
    excludes: ["**/test/**", "**/androidTest/**", "**/*.gradle.kts"]
    ignoreNumbers: ["-1", "0", "1", "2"]

# Exclude generated and build directories
# These patterns apply globally to all rules
